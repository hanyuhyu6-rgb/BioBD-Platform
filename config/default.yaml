# Default Configuration
server:
  host: "0.0.0.0"
  port: 8765
  websocket_path: "/"

data:
  assets_file: "data/assets_master.json"
  update_interval: 3  # seconds
  max_update_assets: 10  # max assets to update per cycle

scoring:
  weights:
    innovation: 0.25
    clinical_progress: 0.20
    market_potential: 0.20
    company_strength: 0.15
    competitive_landscape: 0.20

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

frontend:
  auto_reload: true
  theme: "dark"
